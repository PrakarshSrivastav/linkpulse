linkpulse:
  base-url: http://localhost:8080
  cache:
    ttl: 1h
    not-found-ttl: 60s

logging:
  level:
    org.hibernate.SQL: debug

spring:
  application:
    name: linkpulse
  datasource:
    url: jdbc:postgresql://localhost:5433/linkpulse
    username: linkpulse
    password: linkpulse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics