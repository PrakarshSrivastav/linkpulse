linkpulse:
  base-url: http://localhost:8080
  cache:
    ttl: 1h
    not-found-ttl: 60s

  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
    ttl: 1h

  clicks:
    mode: async            # async | sync (sync = one INSERT per redirect, for comparison)
    queue-capacity: 100000
    batch-size: 1000
    flush-interval-ms: 1000

logging:
  level:
    org.hibernate.SQL: debug

spring:
  application:
    name: linkpulse
  datasource:
    url: jdbc:postgresql://localhost:5433/linkpulse?reWriteBatchedInserts=true
    username: linkpulse
    password: linkpulse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics