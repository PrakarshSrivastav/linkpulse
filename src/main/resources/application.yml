linkpulse:
  base-url: http://localhost:8080
logging:
  level:
    org.hibernate.SQL: debug
spring:
  application:
    name: linkpulse
  datasource:
    url: jdbc:postgresql://localhost:5433/linkpulse
    username: linkpulse
    password: linkpulse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoint:
    health:
      show-details: always