# Loaded on top of src/main/resources/application.yml during tests only.
# A public, test-only secret: it never signs anything outside the test JVM.
linkpulse.jwt.secret=test-only-secret-not-for-production-0123456789
# Off by default in tests: most tests register and log in many times from 127.0.0.1, and the
# buckets live in Redis across runs. RateLimitTest switches it on for itself.
linkpulse.rate-limit.enabled=false
# Random actuator port so tests never collide with a dev app running on 9091.
management.server.port=0
