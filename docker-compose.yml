# Local development only. Ports are bound to 127.0.0.1, so nothing on your network can reach
# Postgres or Redis. Passwords come from .env (see .env.example); the defaults match the app's
# localhost defaults in application.yml.
services:
  postgres:
    image: postgres:16
    container_name: linkpulse-postgres
    environment:
      POSTGRES_DB: linkpulse
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: linkpulse-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-linkpulse-dev}",
              "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
